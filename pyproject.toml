[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provsleuth"
version = "0.5.0"
description = "Deterministic research provenance and claim verification for humans and agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Gabriel Wainstein" }]
keywords = ["provenance", "reproducibility", "knowledge-graph", "data-analysis", "lab-notebook", "dependency-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []   # core engine is stdlib-only

[project.optional-dependencies]
# `verify` only needs whatever YOUR checks import; these are common scientific deps.
verify = ["numpy", "pandas"]
dev = ["pytest"]

[project.scripts]
provsleuth = "provsleuth.cli:main"

[project.urls]
Homepage = "https://github.com/gabwainstein/provsleuth"
Issues = "https://github.com/gabwainstein/provsleuth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provsleuth = [
    "templates/provsleuth-log/SKILL.md",
    "templates/provsleuth-log/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
