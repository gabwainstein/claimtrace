name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.9"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: macos-15-intel, python-version: "3.9"}
          - {os: macos-15-intel, python-version: "3.14"}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build release archives
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify source archive policy
        run: >-
          python -c "import glob, tarfile;
          path = glob.glob('dist/*.tar.gz')[0];
          names = tarfile.open(path).getnames();
          forbidden = [name for name in names if '/tests/' in '/' + name.strip('/') + '/'];
          assert not forbidden, forbidden"
      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          claimtrace --help
          python -c "from importlib.resources import files; \
          assert files('claimtrace').joinpath(
          'templates/claimtrace-log/references/semantic-authoring.md').is_file()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimtrace-distributions
          path: dist/
          if-no-files-found: error
